<div class="absolute top-[-20%] left-[-10%] w-[60vw] h-[60vw] bg-secondary-container rounded-full mix-blend-screen opacity-20 blur-[120px] pointer-events-none"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[50vw] h-[50vw] bg-tertiary-container rounded-full mix-blend-screen opacity-20 blur-[100px] pointer-events-none"></div>

<main class="relative z-10 w-full max-w-[420px] px-container-margin">

<div class="bg-surface-container-low/70 backdrop-blur-[30px] border border-white/10 rounded-[24px] p-[32px] flex flex-col items-center text-center shadow-2xl relative overflow-hidden group">

<div class="absolute inset-0 bg-gradient-to-b from-white/[0.02] to-transparent pointer-events-none"></div>
<!-- Branding -->
<div class="mb-10 flex flex-col items-center">
<div class="w-16 h-16 bg-surface-variant/30 rounded-full flex items-center justify-center border border-white/5 mb-6 shadow-[0_0_40px_rgba(76,244,121,0.1)] group-hover:shadow-[0_0_50px_rgba(76,244,121,0.2)] transition-shadow duration-700">
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">graphic_eq</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-primary mb-3">Spotify Insights</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">

                </p>
</div>
<!-- Action Area -->
<div class="w-full space-y-6">
<!-- Primary Button -->
<button class="w-full bg-primary text-[#000000] font-label-caps text-label-caps py-[16px] px-[24px] rounded-full flex items-center justify-center gap-3 transition-all duration-300 hover:shadow-[0_0_20px_rgba(76,244,121,0.4)] hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.98]">
                    Connect with Spotify
                    <span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
<!-- Disclaimer -->
<p class="font-body-md text-[12px] text-on-surface-variant/50 leading-relaxed">
