<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Spotify Insights - Premium Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-primary": "#003913",
                        "tertiary": "#7ee5ff",
                        "surface-container-highest": "#31353f",
                        "secondary-fixed": "#e9ddff",
                        "background": "#0f131d",
                        "surface": "#0f131d",
                        "on-tertiary": "#003640",
                        "secondary-fixed-dim": "#d0bcff",
                        "primary-fixed": "#69ff89",
                        "surface-container-high": "#262a34",
                        "primary-container": "#1ed760",

                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",

                    "spacing": {
                        "section-gap": "64px",
                        "gutter": "24px",
                        "container-margin": "32px",
                        "component-padding-x": "20px",
                        "component-padding-y": "12px",
                        "unit": "4px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Geist"],
                        "stat-sm": ["JetBrains Mono"],
                        "body-lg": ["Geist"],
                        "body-md": ["Geist"],
                        "headline-xl": ["Geist"],
                        "display-lg": ["Geist"],
                        "stat-lg": ["JetBrains Mono"],
                        "label-caps": ["Geist"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "stat-sm": ["14px", { "lineHeight": "1", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom glow for primary button to match exact design specs while using theme colors */
        .glow-hover:hover {
            box-shadow: 0 0 30px -5px theme('colors.primary.DEFAULT');
        }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden font-body-md antialiased selection:bg-primary/30 selection:text-primary-fixed">
<!-- Ambient Background Glows -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary/5 blur-3xl mix-blend-screen"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-secondary/5 blur-3xl mix-blend-screen"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[40vw] h-[40vw] rounded-full bg-tertiary/5 blur-3xl mix-blend-screen"></div>
</div>
<!-- Main Container - Proportional for Tablet -->
<main class="w-full max-w-lg px-gutter relative z-10 flex flex-col items-center">
<!-- Glassmorphism Card -->
<div class="w-full bg-surface/50 backdrop-blur-2xl border border-white/10 rounded-xl p-container-margin md:p-[48px] flex flex-col items-center text-center shadow-2xl relative overflow-hidden">
<!-- Subtle Card Inner Glow -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary/30 to-transparent"></div>
<!-- Brand Icon -->
<div class="w-16 h-16 rounded-full bg-surface-container-high border border-white/10 flex items-center justify-center mb-8 shadow-[0_0_40px_rgba(30,215,96,0.1)]">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">graphic_eq</span>
</div>
<!-- Headers -->
<h1 class="font-headline-xl text-headline-xl text-on-surface mb-unit">Insights</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-10 max-w-[280px]">
                Unlock premium analytics and deep listening trends.
            </p>
<!-- Value Props (Bento-style micro grid) -->
<div class="w-full grid grid-cols-2 gap-4 mb-10">
<div class="bg-surface-container-low/50 border border-white/5 rounded-lg p-component-padding-y flex flex-col items-center justify-center">
<span class="material-symbols-outlined text-tertiary mb-2">map</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Heatmaps</span>
</div>
<div class="bg-surface-container-low/50 border border-white/5 rounded-lg p-component-padding-y flex flex-col items-center justify-center">
<span class="material-symbols-outlined text-secondary mb-2">psychology</span>
<span class="font-label-caps text-label-caps text-on-surface-variant">Mood Data</span>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary-container text-on-primary-container font-stat-sm text-stat-sm py-[16px] px-container-margin rounded-full flex items-center justify-center gap-3 transition-all duration-300 glow-hover hover:bg-primary">
<svg aria-hidden="true" class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.24 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.781-.18-.6.18-1.2.78-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"></path>
</svg>
                Connect with Spotify
            </button>
<!-- Secondary Actions -->
<div class="mt-8 flex items-center justify-center gap-6">
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-on-surface transition-colors" href="#">Privacy Policy</a>
<div class="w-1 h-1 rounded-full bg-outline-variant"></div>
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-on-surface transition-colors" href="#">Terms of Service</a>
</div>
</div>
<!-- Footer / Trust Badges -->
<div class="mt-8 text-center flex flex-col items-center gap-2">
<span class="material-symbols-outlined text-outline-variant text-xl">lock</span>
<p class="font-label-caps text-label-caps text-outline-variant">Secure Authentication</p>
</div>
</main>
</body></html>
