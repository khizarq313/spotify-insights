<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Minimal Music Personality Card</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&amp;family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#c3c6d4",
                        "on-tertiary": "#571f08",
                        "surface": "#0f131d",
                        "secondary-fixed": "#dfe2f0",
                        "background": "#0f131d",
                        "surface-container-highest": "#313540",
                        "tertiary": "#ffccbb",
                        "on-primary": "#003913",
                        "on-secondary": "#2c303b",
                        "inverse-surface": "#dfe2f1",
                        "on-primary-container": "#005721",
                        "tertiary-fixed": "#ffdbcf",
                        "outline": "#859583",
                        "on-surface-variant": "#bbcbb8",
                        "on-primary-fixed": "#002108",
                        "on-tertiary-container": "#793820",
                        "on-primary-fixed-variant": "#00531f",
                        "surface-dim": "#0f131d",
                        "surface-variant": "#313540",
                        "on-error": "#690005",
                        "surface-tint": "#34e36a",
                        "on-secondary-container": "#b5b8c6",
                        "surface-container-low": "#171b26",
                        "primary-fixed-dim": "#34e36a",
                        "primary": "#4cf479",
                        "on-background": "#dfe2f1",
                        "surface-bright": "#353944",
                        "on-tertiary-fixed": "#380d00",
                        "tertiary-fixed-dim": "#ffb59b",
                        "surface-container": "#1b1f2a",
                        "on-secondary-fixed-variant": "#434752",
                        "outline-variant": "#3c4a3c",
                        "on-secondary-fixed": "#171b25",
                        "secondary-container": "#454954",
                        "secondary": "#c3c6d4",
                        "surface-container-lowest": "#0a0e18",
                        "error": "#ffb4ab",
                        "error-container": "#93000a",
                        "on-error-container": "#ffdad6",
                        "inverse-primary": "#006e2c",
                        "tertiary-container": "#ffa585",
                        "on-tertiary-fixed-variant": "#73341c",
                        "on-surface": "#dfe2f1",
                        "inverse-on-surface": "#2c303b",
                        "primary-container": "#1ed760",
                        "surface-container-high": "#262a35",
                        "primary-fixed": "#69ff89"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "lg": "24px",
                        "gutter": "16px",
                        "md": "16px",
                        "unit": "4px",
                        "margin": "24px",
                        "xl": "48px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "mono-label": ["Geist Mono"],
                        "body-lg": ["Geist Sans"],
                        "label-md": ["Geist Sans"],
                        "h1": ["Geist Sans"],
                        "h3": ["Geist Sans"],
                        "h2": ["Geist Sans"],
                        "body-md": ["Geist Sans"]
                    },
                    "fontSize": {
                        "mono-label": ["12px", { "lineHeight": "16px", "letterSpacing": "0", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "h1": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "h3": ["18px", { "lineHeight": "28px", "letterSpacing": "0", "fontWeight": "600" }],
                        "h2": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body-md">
<!-- TopNavBar for top-level destination context -->
<nav class="bg-surface-container-low border-b border-surface-bright flex flex-col md:hidden w-full sticky top-0 z-50 px-gutter h-16 justify-center">
<div class="flex justify-between items-center w-full">
<span class="font-h2 text-h2 text-primary-container">SonicTrack</span>
<div class="flex gap-sm">
<span class="material-symbols-outlined text-primary cursor-pointer active:opacity-80 p-sm hover:bg-surface-container-highest transition-colors rounded">notifications</span>
<span class="material-symbols-outlined text-primary cursor-pointer active:opacity-80 p-sm hover:bg-surface-container-highest transition-colors rounded">settings</span>
</div>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="p-gutter md:p-margin max-w-md mx-auto md:max-w-3xl pb-xl md:pb-margin flex justify-center items-start min-h-[calc(100vh-64px)]">
<!-- Personality Card -->
<article class="bg-surface-container-low border border-surface-bright p-gutter md:p-margin w-full flex flex-col gap-lg mt-md">
<!-- Header Section -->
<header class="flex flex-col gap-xs items-center text-center">
<span class="font-mono-label text-mono-label text-on-surface-variant uppercase tracking-widest">Sonic Profile</span>
<h1 class="font-h1 text-h1 text-on-background">The Alchemist</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">You blend obscure genres with precise acoustic elements to create gold.</p>
</header>
<!-- Divider -->
<div class="h-px bg-surface-bright w-full"></div>
<!-- Metrics Section -->
<section class="flex flex-col gap-md w-full">
<!-- Metric 1 -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center w-full">
<span class="font-label-md text-label-md text-on-surface">Obscurity</span>
<span class="font-mono-label text-mono-label text-primary-container">87%</span>
</div>
<div class="h-2 w-full bg-surface-container-highest">
<div class="h-full bg-primary-container w-[87%]"></div>
</div>
</div>
<!-- Metric 2 -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center w-full">
<span class="font-label-md text-label-md text-on-surface">Acousticness</span>
<span class="font-mono-label text-mono-label text-primary-container">64%</span>
</div>
<div class="h-2 w-full bg-surface-container-highest">
<div class="h-full bg-primary-container w-[64%]"></div>
</div>
</div>
<!-- Metric 3 -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center w-full">
<span class="font-label-md text-label-md text-on-surface">Energy</span>
<span class="font-mono-label text-mono-label text-primary-container">42%</span>
</div>
<div class="h-2 w-full bg-surface-container-highest">
<div class="h-full bg-primary-container w-[42%]"></div>
</div>
</div>
</section>
<!-- Divider -->
<div class="h-px bg-surface-bright w-full"></div>
<!-- Lists Section -->
<section class="grid grid-cols-2 gap-md w-full">
<!-- Base Elements -->
<div class="flex flex-col gap-sm">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Base Elements</h3>
<ul class="flex flex-col gap-xs">
<li class="font-body-md text-body-md text-on-surface">Neo-Psychedelia</li>
<li class="font-body-md text-body-md text-on-surface">Shoegaze</li>
<li class="font-body-md text-body-md text-on-surface">Art Pop</li>
</ul>
</div>
<!-- Catalysts -->
<div class="flex flex-col gap-sm">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Catalysts</h3>
<ul class="flex flex-col gap-xs">
<li class="font-body-md text-body-md text-on-surface">Tame Impala</li>
<li class="font-body-md text-body-md text-on-surface">Beach House</li>
<li class="font-body-md text-body-md text-on-surface">Björk</li>
</ul>
</div>
</section>
<!-- Actions -->
<footer class="mt-sm flex justify-center w-full">
<button class="bg-primary-container text-surface font-label-md text-label-md px-gutter py-sm w-full hover:bg-primary-fixed transition-colors flex items-center justify-center gap-xs">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">ios_share</span>
                    Export Card
                </button>
</footer>
</article>
</main>
</body></html>
