<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SonicTrack - Login</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: Geist Sans & Mono -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&amp;family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<!-- Tailwind Configuration (Provided) -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-fixed-dim": "#c3c6d4",
                    "on-tertiary": "#571f08",
                    "surface": "#0f131d",
                    "secondary-fixed": "#dfe2f0",
                    "background": "#0f131d",
                    "surface-container-highest": "#313540",
                    "tertiary": "#ffccbb",
                    "on-primary": "#003913",
                    "on-secondary": "#2c303b",
                    "inverse-surface": "#dfe2f1",
                    "on-primary-container": "#005721",
                    "tertiary-fixed": "#ffdbcf",
                    "outline": "#859583",
                    "on-surface-variant": "#bbcbb8",
                    "on-primary-fixed": "#002108",
                    "on-tertiary-container": "#793820",
                    "on-primary-fixed-variant": "#00531f",
                    "surface-dim": "#0f131d",
                    "surface-variant": "#313540",
                    "on-error": "#690005",
                    "surface-tint": "#34e36a",
                    "on-secondary-container": "#b5b8c6",
                    "surface-container-low": "#171b26",
                    "primary-fixed-dim": "#34e36a",
                    "primary": "#4cf479",
                    "on-background": "#dfe2f1",
                    "surface-bright": "#353944",
                    "on-tertiary-fixed": "#380d00",
                    "tertiary-fixed-dim": "#ffb59b",
                    "surface-container": "#1b1f2a",
                    "on-secondary-fixed-variant": "#434752",
                    "outline-variant": "#3c4a3c",
                    "on-secondary-fixed": "#171b25",
                    "secondary-container": "#454954",
                    "secondary": "#c3c6d4",
                    "surface-container-lowest": "#0a0e18",
                    "error": "#ffb4ab",
                    "error-container": "#93000a",
                    "on-error-container": "#ffdad6",
                    "inverse-primary": "#006e2c",
                    "tertiary-container": "#ffa585",
                    "on-tertiary-fixed-variant": "#73341c",
                    "on-surface": "#dfe2f1",
                    "inverse-on-surface": "#2c303b",
                    "primary-container": "#1ed760",
                    "surface-container-high": "#262a35",
                    "primary-fixed": "#69ff89"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xs": "4px",
                    "lg": "24px",
                    "gutter": "16px",
                    "md": "16px",
                    "unit": "4px",
                    "margin": "24px",
                    "xl": "48px",
                    "sm": "8px"
            },
            "fontFamily": {
                    "mono-label": ["Geist Mono", "monospace"],
                    "body-lg": ["Geist", "sans-serif"],
                    "label-md": ["Geist", "sans-serif"],
                    "h1": ["Geist", "sans-serif"],
                    "h3": ["Geist", "sans-serif"],
                    "h2": ["Geist", "sans-serif"],
                    "body-md": ["Geist", "sans-serif"]
            },
            "fontSize": {
                    "mono-label": ["12px", { "lineHeight": "16px", "letterSpacing": "0", "fontWeight": "400" }],
                    "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0", "fontWeight": "400" }],
                    "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                    "h1": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                    "h3": ["18px", { "lineHeight": "28px", "letterSpacing": "0", "fontWeight": "600" }],
                    "h2": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                    "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0", "fontWeight": "400" }]
            }
          }
        }
      }
    </script>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-gutter md:p-xl font-body-md antialiased text-on-surface">
<!-- Minimalist Flat Login Card adapted for Tablet -->
<main class="w-full max-w-[420px] bg-surface-container-low border border-surface-bright p-xl flex flex-col gap-xl relative">
<!-- Header / Identity -->
<header class="flex flex-col items-center text-center gap-sm">
<span class="material-symbols-outlined text-[48px] text-primary-container mb-xs" style="font-variation-settings: 'FILL' 1;">
                graphic_eq
            </span>
<h1 class="font-h1 text-h1 text-on-surface tracking-tight">SonicTrack</h1>
<p class="font-mono-label text-mono-label text-on-surface-variant uppercase tracking-widest mt-unit">Secure Gateway</p>
</header>
<!-- Primary Action Area -->
<div class="flex flex-col gap-margin">
<!-- Contextual Helper Text -->
<div class="text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Authenticate via your connected streaming provider to access the Pro Dashboard.
                </p>
</div>
<!-- Spotify Connect Button (Primary Interaction Level 2) -->
<button class="group w-full flex items-center justify-center gap-sm bg-primary-container text-surface py-3 px-4 font-label-md text-label-md transition-colors hover:bg-primary-fixed rounded-none focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">
                    library_music
                </span>
<span class="font-bold tracking-wide">Connect with Spotify</span>
</button>
<!-- Brutalist Divider -->
<div class="flex items-center gap-md py-sm">
<div class="flex-1 h-px bg-surface-bright"></div>
<span class="font-mono-label text-mono-label text-on-surface-variant uppercase bg-surface-container-low px-xs">Admin Access</span>
<div class="flex-1 h-px bg-surface-bright"></div>
</div>
<!-- Fallback Secondary Form (Flat / High Contrast) -->
<form class="flex flex-col gap-md">
<div class="flex flex-col gap-unit">
<label class="font-mono-label text-mono-label text-on-surface-variant uppercase" for="admin-id">Identifier</label>
<input class="w-full bg-surface-container-low border border-surface-bright text-on-surface placeholder:text-secondary-container px-4 py-3 font-mono-label text-mono-label focus:border-primary-container focus:ring-0 rounded-none transition-colors outline-none" id="admin-id" placeholder="SYS-ID" type="text"/>
</div>
<!-- Secondary Button (Ghost/Bordered style as per specs) -->
<button class="w-full flex items-center justify-center gap-sm bg-transparent border border-surface-bright text-on-surface py-3 px-4 font-label-md text-label-md hover:bg-surface-bright transition-colors rounded-none mt-xs focus:outline-none" type="submit">
<span>CLI Login</span>
<span class="material-symbols-outlined text-[18px]">terminal</span>
</button>
</form>
</div>
<!-- Utility Footer -->
<footer class="mt-sm flex flex-col md:flex-row justify-between items-center gap-sm pt-md border-t border-surface-bright">
<a class="font-mono-label text-mono-label text-on-surface-variant hover:text-on-surface transition-colors flex items-center gap-xs" href="#">
<span class="material-symbols-outlined text-[14px]">help</span>
                Support
            </a>
<span class="font-mono-label text-mono-label text-surface-bright hidden md:inline">|</span>
<a class="font-mono-label text-mono-label text-on-surface-variant hover:text-on-surface transition-colors flex items-center gap-xs" href="#">
<span class="material-symbols-outlined text-[14px]">dns</span>
                System Status
            </a>
</footer>
</main>
</body></html>
